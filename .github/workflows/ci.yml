# M0 merge gates on GitHub-hosted runners (ADR 0001 bootstrap profile, NFR-3).
# Security rules: docs/process/ci-security.md. Checked by ci/policy_checks.py.
# Never add pull_request_target, workflow_run, self-hosted runners or secrets here.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NEXTEST_VERSION: "0.9.151"
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  rust-linux:
    name: rust (fmt, clippy, nextest) linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version && cargo --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --locked --no-fail-fast
      - name: doctests
        run: cargo test --workspace --doc --locked

  rust-macos:
    name: rust (build, nextest) macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@${{ env.NEXTEST_VERSION }}
      - name: cargo nextest
        run: cargo nextest run --workspace --locked --no-fail-fast

  licences:
    name: licences and advisories (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - name: cargo deny
        run: cargo deny --locked check

  hook-tests:
    name: hook and policy-script tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: commit-msg hook fixtures
        run: python3 .githooks/tests/run.py
      - name: CI attribution check tests (hook parity)
        run: python3 -m unittest discover -s ci/tests -v

  attribution:
    name: attribution policy (D-52)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan commits, title, body and added lines
        run: |
          base="$(jq -r '.pull_request.base.sha // .before // empty' "$GITHUB_EVENT_PATH")"
          trusted="$RUNNER_TEMP/trusted-ci"
          mkdir -p "$trusted"
          if [ -n "$base" ] \
            && git cat-file -e "$base:ci/attribution_policy.py" 2>/dev/null \
            && git cat-file -e "$base:ci/attribution-match.pl" 2>/dev/null; then
            git show "$base:ci/attribution_policy.py" > "$trusted/attribution_policy.py"
            git show "$base:ci/attribution-match.pl" > "$trusted/attribution-match.pl"
            echo "Using policy scripts from base $base"
          else
            echo "::warning::bootstrap: policy scripts are not on the base branch; using this revision's copies"
            cp ci/attribution_policy.py ci/attribution-match.pl "$trusted/"
          fi
          python3 "$trusted/attribution_policy.py"

  docs:
    name: documentation gates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Links and traceability
        run: python3 ci/doc_gates.py

  policy:
    name: repository policy (unsafe scope, workflow hardening)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Policy checks
        run: python3 ci/policy_checks.py

  merge-gates:
    name: merge-gates
    if: always()
    needs: [rust-linux, rust-macos, licences, hook-tests, attribution, docs, policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          failed = False
          for job, data in sorted(needs.items()):
              result = data["result"]
              print(f"{'PASS' if result == 'success' else 'FAIL'}: {job} ({result})")
              failed |= result != "success"
          not_applicable = {
              "typescript fmt/lint/tests": "no TypeScript package exists yet (apps/web)",
              "numerical-reference": "no numerical model or reference fixtures exist yet",
              "benchmark-regression": "B1 profile starts at M1 on the D-65 target runner",
              "mutation": "no commitment/redispatch/network/pricing/optimisation model logic yet",
              "gpu-validation": "no enabled GPU adapter (cuOpt is a capability stub)",
          }
          for gate, reason in not_applicable.items():
              print(f"N/A: {gate}: {reason}")
          print("MANUAL: independent-review evidence and adversarial triage are verified by the "
                "coordinator on the exact head SHA (NFR-3.AC3, NFR-3.AC5)")
          sys.exit(1 if failed else 0)
          PY
