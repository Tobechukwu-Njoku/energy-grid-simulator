# GitHub runs this workflow from the PR base (main). The head is fetched only
# as Git objects. Only main's xtask and toolchain run.
name: trusted-gates

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: trusted-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  review-tier:
    name: evaluate review tier
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      # pull_request_target runs on main's SHA. Publish on the PR head and
      # GitHub's test merge commit, which can carry the required CI checks.
      - name: Mark the PR head pending
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -f context=review-tier -f state=pending \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch current main and the pull-request head as Git data
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NUMBER" | grep -Eqx '[0-9]+'
          printf '%s\n' "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            fetch --no-tags --quiet origin \
              "+refs/heads/main:refs/remotes/origin/main" \
              "+refs/pull/$NUMBER/head:refs/remotes/pull/head" \
              "+refs/pull/$NUMBER/merge:refs/remotes/pull/merge"
          main="$(git rev-parse refs/remotes/origin/main)"
          merge="$(git rev-parse refs/remotes/pull/merge)"
          test "$(git rev-parse refs/remotes/pull/head)" = "$HEAD_SHA"
          test "$(git show -s --format=%P "$merge")" = "$main $HEAD_SHA"
          git update-ref refs/review-tier/test-merge "$merge"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$merge" \
            -f context=review-tier -f state=pending \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          git checkout --quiet --detach "$main"
      - name: Install main's pinned toolchain
        run: rustup toolchain install && rustc --version
      - name: Check tier, current-head reviews and feat/fix test files
        id: evaluate
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo run --locked --quiet -p xtask -- review-tier --main refs/remotes/origin/main
      - name: Publish review-tier on the PR head and test merge commit
        if: ${{ always() && !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          REVIEW_RESULT: ${{ steps.evaluate.outcome == 'success' && 'success' || 'failure' }}
        run: |
          set -euo pipefail
          printf '%s\n' "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'
          merge="$(git rev-parse --verify --quiet refs/review-tier/test-merge || true)"
          for sha in "$HEAD_SHA" "$merge"; do
            if [ -z "$sha" ]; then continue; fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$sha" \
              -f context=review-tier -f state="$REVIEW_RESULT" \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          done
