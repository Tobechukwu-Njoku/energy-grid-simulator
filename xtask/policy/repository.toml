# Trusted repository policy (D-56, D-73, ADR 0001). Read from the base branch in CI.
# Changing it needs the policy owner's review (.github/CODEOWNERS, policy-approval).

# GitHub login whose approval protected-path changes need (D-74).
policy_owner = "Tobechukwu-Njoku"

# Separate GitHub machine account agents push and open pull requests from (D-74),
# so the owner can approve them. ASSUMPTION: placeholder name until the owner
# creates the account; change it here when it exists.
agent_account = "egs-bot"

# Paths whose change is a policy change. Keep in step with .github/CODEOWNERS.
protected_paths = [
    "/.github/",
    "/.githooks/",
    "/.cargo/",
    "/xtask/",
    "/deny.toml",
    "/Cargo.toml",
    "/rust-toolchain.toml",
    "/docs/security/",
]

# ASSUMPTION (D-17 open): placeholder licence carried by every workspace crate until
# the owner chooses one. It lets cargo-deny check private crates (no ignore).
workspace_licence = "LicenseRef-EGS-Unreleased"

# D-73: Python only in spikes/ and offline reference validators.
python_allowed = ["spikes/", "tools/reference-validators/"]

# D-56 data gate. A tracked file with one of these extensions must be either an
# exact path in data_metadata_files (provenance, fixtures, aggregates), or a file
# under open_commercial_data whose name (or sample_sources alias) has an
# open-commercial record in a provenance manifest or sources.tsv (F9).
data_extensions = [
    ".csv", ".tsv", ".parquet", ".feather", ".arrow", ".xlsx", ".xls", ".ods", ".zip",
    ".gz", ".bz2", ".xz", ".7z", ".tar", ".nc", ".cdf", ".grib", ".grib2", ".grb", ".h5",
    ".hdf5", ".mat", ".m", ".npy", ".npz", ".pkl", ".pickle", ".json", ".jsonl",
    ".ndjson", ".xml", ".raw", ".rawx", ".sav", ".dyr", ".epc", ".sqlite", ".db",
    ".dbf", ".shp", ".gpkg", ".kml", ".kmz", ".pbf", ".osm", ".geojson", ".pdf",
    # Compressed and archive formats (ADV23R7-02). The gate also detects data,
    # archive and compressed files by their content, whatever their name.
    ".zst", ".zstd", ".zstandard", ".lz4", ".lz", ".lzma", ".lzo", ".br", ".bz", ".tbz",
    ".tbz2", ".tgz", ".txz", ".tzst", ".tlz", ".z", ".sz", ".snappy", ".rar", ".cab",
    ".gzip", ".cpio", ".zipx", ".jar", ".war", ".ar",
    # Further columnar, statistical and database formats.
    ".avro", ".orc", ".ipc", ".parq", ".duckdb", ".sqlite3", ".db3", ".mdb", ".accdb",
    ".xlsb", ".xlsm", ".rds", ".rdata", ".rda", ".dta", ".sas7bdat", ".nc4", ".he5",
    ".zarr", ".msgpack", ".bson", ".protobuf", ".pb", ".tfrecord", ".pt", ".pth",
    ".safetensors", ".onnx", ".joblib",
    # Power-system network models and exchange formats (ADV23R8-04): CGMES/CIM
    # RDF-XML and other RDF serialisations, PowerFactory projects and cases,
    # PowerWorld, PSS/E variants, UCTE-DEF, PowSyBl IIDM, OpenDSS, GridLAB-D,
    # MATPOWER/PSAT cases. CIM/RDF XML is also detected by its content.
    ".rdf", ".owl", ".ttl", ".nt", ".nq", ".trig", ".jsonld", ".cim", ".pfd", ".dz",
    ".dgs", ".pwb", ".pwd", ".seq", ".rawd", ".uct", ".uctx", ".iidm", ".xiidm",
    ".dss", ".glm", ".psse", ".cgmes",
]
open_commercial_data = ["spikes/data/samples/*"]
# Exact paths of provenance records, test fixtures and non-reconstructive
# aggregates that carry a data extension but are not datasets.
data_metadata_files = [
    ".githooks/tests/fixtures.json",
    "spikes/data/sources.tsv",
    "spikes/data/era5-request-2024-01.json",
    "spikes/data/samples/download-manifest.json",
    "spikes/data/samples/network-statistics.json",
    "spikes/data/samples/tabular-statistics.json",
    "spikes/data-gathering/elexon/verification-2026-11-13.json",
    "spikes/data-gathering/elexon/verification-supplement-2026-11-13.json",
]

# Synthetic, non-working example keys quoted in review reports. Each names one
# exact line of one file by the Git blob hash of the line text (so this file does
# not repeat the key); never a wildcard.
[[secret_exemption]]
path = "docs/requirements/reviews/gemini-2026-11-13-pr23-r2.md"
line_blob = "d38e78289d703f77d3083278ff71cd146aecb5c2"
reason = "ADV23R-09 reproduction input; a synthetic hexadecimal sequence, not a credential"

# Committed sample name -> the provenance record (sources.tsv local-name) it was cut from.
[sample_sources]
"spikes/data/samples/generation-2024.csv" = "generation-mix.csv"

# Reviewed native solver adapters (ADR 0001, ADR 0003): the only local packages
# whose library, binary and test targets may allow unsafe code. Each entry names
# the exact Cargo package AND its repository directory; both must match. A new
# adapter, or any change here, is a change to this protected file and needs the
# policy owner's exact-head approval (D-74). Build scripts are never exempt.
[[adapter]]
package = "egs-solver-highs"
path = "crates/solver-highs"

[[adapter]]
package = "egs-solver-gurobi"
path = "crates/solver-gurobi"

[[adapter]]
package = "egs-solver-xpress"
path = "crates/solver-xpress"

[[adapter]]
package = "egs-solver-cuopt"
path = "crates/solver-cuopt"
