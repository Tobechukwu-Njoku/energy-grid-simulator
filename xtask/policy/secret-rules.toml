# Trusted secret-scanning policy (D-56, ADR 0001 provenance/secrets/data,
# ADV23R12-01/02). Changing it needs the policy owner's review.
#
# The secret formats come from the gitleaks default ruleset, vendored unchanged
# in gitleaks.toml (MIT licence, notice in gitleaks-LICENSE.txt). xtask evaluates
# its regexes, secretGroup, entropy, keywords, path rules and allowlists in
# Rust (xtask/src/secrets.rs); it does not run gitleaks. Differences: the
# global allowlist's path list is NOT applied (every tracked file is scanned),
# and every text view of a file is scanned (raw bytes, UTF-8, UTF-16 and
# UTF-32 in both byte orders and every alignment; R12-01). Any rule that does
# not compile, or any key xtask does not understand, fails the check closed.
# Update procedure: CONTRIBUTING.md, "Updating the gitleaks ruleset".
[vendor]
file = "xtask/policy/gitleaks.toml"
licence = "MIT"
licence_file = "xtask/policy/gitleaks-LICENSE.txt"
version = "v8.30.1"
commit = "83d9cd684c87d95d656c1458ef04895a7f1cbd8e"
source = "https://github.com/gitleaks/gitleaks/blob/83d9cd684c87d95d656c1458ef04895a7f1cbd8e/config/gitleaks.toml"
# Git blob id of the vendored file (`git hash-object xtask/policy/gitleaks.toml`);
# the check fails if the file differs from the pinned upstream copy.
blob = "256f64790ea6d954f0041024be2938089ae1e7a7"

# Local allowlists, in the gitleaks schema (targetRules limits one to named
# rules). Keep each one as narrow as possible.

# sourcegraph-access-token also accepts a bare 40-digit hexadecimal string,
# which is indistinguishable from a Git commit id; this repository's reviews and
# status quote commit ids next to the word Sourcegraph. Its sgp_ forms remain.
[[allowlists]]
description = "Git commit ids are not Sourcegraph tokens"
targetRules = ["sourcegraph-access-token"]
regexes = ['''^[0-9a-fA-F]{40}$''']

# Local rules, in the gitleaks rule schema, evaluated on top of the vendored
# ruleset. They cover formats gitleaks lacks (private-key armour headers on
# their own, PuTTY keys) and keep the earlier prefix rules, which have no
# entropy threshold, so low-entropy synthetic tokens stay detected. New
# provider formats belong upstream: update the vendored ruleset instead of
# adding prefixes here. Patterns are written so this file does not match them.

[[rules]]
id = "local-private-key-header"
description = "Private key armour header"
regex = '''-----BEGI[N][^\n]*PRIVATE[ ]KEY|PRIVATE[ ]KEY[^\n]*-----BEGI[N]'''

[[rules]]
id = "local-putty-private-key"
description = "PuTTY private key file header (ADV23R12-01)"
regex = '''PuTTY-User-Key-File-[0-9]+[ \t]*:'''
keywords = ["putty-user-key-file"]

[[rules]]
id = "local-putty-key-file"
description = "PuTTY private key file (.ppk)"
path = '''(?i)\.ppk$'''

[[rules]]
id = "local-aws-access-key"
description = "AWS access key"
regex = '''(?:^|[^A-Za-z0-9])((?:AKIA|ASIA)[A-Z0-9]{16,})'''

[[rules]]
id = "local-github-token"
description = "GitHub token"
regex = '''(?:^|[^A-Za-z0-9])(gh[pousr]_[A-Za-z0-9_-]{36,}|github_pat_[A-Za-z0-9_-]{40,})'''

[[rules]]
id = "local-slack-token"
description = "Slack token"
regex = '''(?:^|[^A-Za-z0-9])((?:xox[bpar]|xapp)-[A-Za-z0-9_-]{20,})'''

[[rules]]
id = "local-slack-webhook"
description = "Slack webhook"
regex = '''(?:^|[^A-Za-z0-9])(hooks\.slack\.com/services/T[A-Za-z0-9_/-]{20,})'''

[[rules]]
id = "local-google-api-key"
description = "Google API key"
regex = '''(?:^|[^A-Za-z0-9])(AIza[A-Za-z0-9_-]{35,})'''

[[rules]]
id = "local-openai-anthropic-key"
description = "OpenAI project or Anthropic key"
regex = '''(?:^|[^A-Za-z0-9])(sk-(?:proj|ant)-[A-Za-z0-9_-]{32,})'''

[[rules]]
id = "local-stripe-key"
description = "Stripe key"
regex = '''(?:^|[^A-Za-z0-9])((?:sk|rk)_live_[A-Za-z0-9_-]{20,})'''

[[rules]]
id = "local-gitlab-token"
description = "GitLab token"
regex = '''(?:^|[^A-Za-z0-9])(glpat-[A-Za-z0-9_-]{20,})'''

[[rules]]
id = "local-pypi-token"
description = "PyPI token"
regex = '''(?:^|[^A-Za-z0-9])(pypi-AgE[A-Za-z0-9_-]{50,})'''

[[rules]]
id = "local-digitalocean-token"
description = "DigitalOcean token"
regex = '''(?:^|[^A-Za-z0-9])(dop_v1_[A-Za-z0-9_-]{64,})'''

# Generic prefixes: the token must mix letters and digits, expressed as an
# allowlist of all-letter and all-digit tails.

[[rules]]
id = "local-sk-key"
description = "OpenAI-style key"
regex = '''(?:^|[^A-Za-z0-9])(sk-[A-Za-z0-9_-]{32,})'''
[[rules.allowlists]]
regexes = ['''^sk-[^0-9]*$''', '''^sk-[^A-Za-z]*$''']

[[rules]]
id = "local-hugging-face-token"
description = "Hugging Face token"
regex = '''(?:^|[^A-Za-z0-9])(hf_[A-Za-z0-9_-]{30,})'''
[[rules.allowlists]]
regexes = ['''^hf_[^0-9]*$''', '''^hf_[^A-Za-z]*$''']

[[rules]]
id = "local-npm-token"
description = "npm token"
regex = '''(?:^|[^A-Za-z0-9])(npm_[A-Za-z0-9_-]{36,})'''
[[rules.allowlists]]
regexes = ['''^npm_[^0-9]*$''', '''^npm_[^A-Za-z]*$''']

[[rules]]
id = "local-google-oauth-token"
description = "Google OAuth token"
regex = '''(?:^|[^A-Za-z0-9])(ya29\.[A-Za-z0-9_.-]{30,})'''
[[rules.allowlists]]
regexes = ['''^ya29\.[^0-9]*$''', '''^ya29\.[^A-Za-z]*$''']

[[rules]]
id = "local-sendgrid-key"
description = "SendGrid key"
regex = '''(?:^|[^A-Za-z0-9])(SG\.[A-Za-z0-9_.-]{60,})'''
[[rules.allowlists]]
regexes = ['''^SG\.[^0-9]*$''', '''^SG\.[^A-Za-z]*$''']

[[rules]]
id = "local-groq-key"
description = "Groq key"
regex = '''(?:^|[^A-Za-z0-9])(gsk_[A-Za-z0-9_-]{40,})'''
[[rules.allowlists]]
regexes = ['''^gsk_[^0-9]*$''', '''^gsk_[^A-Za-z]*$''']

[[rules]]
id = "local-xai-key"
description = "xAI key"
regex = '''(?:^|[^A-Za-z0-9])(xai-[A-Za-z0-9_-]{40,})'''
[[rules.allowlists]]
regexes = ['''^xai-[^0-9]*$''', '''^xai-[^A-Za-z]*$''']

[[rules]]
id = "local-azure-storage-key"
description = "Azure storage key"
regex = '''(?:^|[^A-Za-z0-9])(AccountKey=[A-Za-z0-9+/=]{40,})'''
[[rules.allowlists]]
regexes = ['''^AccountKey=[^0-9]*$''', '''^AccountKey=[^A-Za-z]*$''']
